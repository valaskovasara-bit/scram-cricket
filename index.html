<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111522"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Naše šipky – Scram Cricket</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f8fc;background:#111522}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:850px;margin:auto}h1{font-size:25px;margin:8px 0 4px}h2{font-size:17px;margin:0 0 8px}.muted{color:#aab3c7}.panel{background:#1d2537;border:1px solid #354158;border-radius:17px;padding:15px;margin:12px 0}button,select{background:#2d3850;border:1px solid #52617a;color:white;border-radius:11px;padding:12px;font-size:16px;cursor:pointer}button:disabled{opacity:.35}button.active{outline:2px solid #ffcb63}button.big{width:100%;padding:18px;font-weight:800;font-size:20px;background:#3765bb}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{border-radius:14px;padding:14px;background:#151c2b;border:2px solid #354158}.player.current{box-shadow:0 0 0 2px #fff5}.score{font-size:39px;font-weight:850}.red{color:#ff6470}.blue{color:#66a7ff}.targets{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.target{padding:12px 1px;font-size:15px}.target.active{background:#8b6324;border-color:#fbc869}.target.closed{opacity:.45}.hits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hits button{padding:16px 6px;font-weight:750}.small{font-size:13px}.history{max-height:200px;overflow:auto}.history div{border-bottom:1px solid #354158;padding:6px 0}label{display:block;margin:8px 0 5px}.danger{background:#773b45}#status{font-weight:700;color:#ffda84}#toast{position:fixed;bottom:20px;left:10%;width:80%;background:#33435f;padding:12px;border-radius:12px;display:none;text-align:center}@media(max-width:500px){body{padding:10px}.panel{padding:11px}.score{font-size:32px}.targets{gap:3px}.target{font-size:13px;padding:11px 0}}</style></head><body><h1>🎯 SCRAM CRICKET ❤️💙</h1><div class="muted">Naše šipky · SÁJA × VOKUREK</div><section class="panel" id="settings"><h2>Nastavení hry</h2><label>Začíná</label><div class="row"><button id="start0">❤️ SÁJA</button><button id="start1">💙 VOKUREK</button></div><label>Pořadí terčů</label><select id="sequence" style="width:100%"><option value="0">Bull → 15 → 16 → 17 → 18 → 19 → 20</option><option value="1">Bull → 20 → 19 → 18 → 17 → 16 → 15</option><option value="2">20 → 19 → 18 → 17 → 16 → 15 → Bull</option><option value="3">Bez pořadí · libovolný terč</option></select></section><section class="panel"><div id="status"></div><div class="players"><div id="p0" class="player"><strong class="red">❤️ SÁJA</strong><div class="score" id="score0">0</div><div class="small" id="role0"></div></div><div id="p1" class="player"><strong class="blue">💙 VOKUREK</strong><div class="score" id="score1">0</div><div class="small" id="role1"></div></div></div><p id="turn"></p><div class="targets" id="targets"></div><p id="marks"></p><p id="darts"></p></section><section class="panel"><h2>Zapsat šipku</h2><div class="hits" id="hitButtons"></div><p class="small muted" id="hitHelp">Vyber zásah aktuálního terče.</p><button class="big" onclick="next()">DALŠÍ HRÁČ ➜</button><div class="row" style="margin-top:10px"><button onclick="undo()">↶ Vrátit poslední akci</button><button onclick="reset()" class="danger">Nová hra</button></div></section><section class="panel"><h2>Historie tahů</h2><div class="history" id="history"></div></section><div id="toast"></div><script>
const names=['SÁJA','VOKUREK'],orders=[[25,15,16,17,18,19,20],[25,20,19,18,17,16,15],[20,19,18,17,16,15,25],[20,19,18,17,16,15,25]],KEY='nase-sipky-scram-v2';let s,undoStack=[];const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));function fresh(){return {starter:0,order:0,round:0,target:0,player:0,darts:[],marks:0,scores:[0,0],closed:false,finished:false,history:[],done:[]}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&[0,1].includes(x.starter)&&[0,1,2,3].includes(x.order)&&Array.isArray(x.scores))return x}catch(e){}return fresh()}s=load();function save(){localStorage.setItem(KEY,JSON.stringify(s))}function snapshot(){undoStack.push(clone(s));if(undoStack.length>150)undoStack.shift()}function scorer(){return s.round===0?1-s.starter:s.starter}function closer(){return 1-scorer()}function target(){return orders[s.order][s.target]}
function chooseTarget(i){if(s.finished||s.order!==3||s.darts.length||s.closed||s.done.includes(i))return;snapshot();s.target=i;s.marks=0;save();render()}function textTarget(v){return v===25?'BULL':String(v)}function points(n){return target()===25?n===50?50:n===25?25:0:target()*n}function marks(n){return target()===25?n===50?2:n===25?1:0:n}function hit(n){if(s.finished||s.darts.length>=3)return;let p=s.player;if(n===25||n===50){if(target()!==25){alert('Právě se hraje '+textTarget(target())+', ne Bull.');return}}else if(n!==0&&target()===25){alert('Právě se hraje Bull.');return}snapshot();let val=0,m=0;if(n!==0){m=marks(n);if(p===closer()){s.marks=Math.min(3,s.marks+m)}else if(!s.closed){val=points(n);s.scores[p]+=val}}s.darts.push({player:p,label:n===0?'MIMO':n===25?'Bull 25':n===50?'Bull 50':(n===1?'S':n===2?'D':'T')+target(),value:val,mark:m});if(p===closer()&&s.marks>=3)s.closed=true;if(s.round===1&&s.scores[scorer()]>s.scores[1-scorer()]){s.finished=true;recordTurn();s.history.push('🏆 '+names[scorer()]+' vítězí překonáním skóre!')}else if(s.darts.length===3){finishTurn()}save();render()}function recordTurn(){if(s.darts.length){s.history.push(names[s.player]+': '+s.darts.map(d=>d.label).join(', ')+' ('+s.darts.reduce((a,d)=>a+d.value,0)+' bodů)');s.darts=[]}}function finishTurn(){recordTurn();if(s.closed&&s.player===scorer()){advanceTarget()}else s.player=1-s.player}function advanceTarget(){
 if(s.order===3){s.done.push(s.target);const next=orders[3].findIndex((_,i)=>!s.done.includes(i));s.target=next<0?7:next}
 else s.target++;
 s.marks=0;s.closed=false;
 if(s.target===7){if(s.round===0){s.round=1;s.target=0;s.done=[];s.player=1-s.starter}else{s.finished=true;s.history.push('🏁 Konec hry! '+(s.scores[0]===s.scores[1]?'Remíza.':'Vítězí '+names[s.scores[0]>s.scores[1]?0:1]+'!'))}}else{s.player=closer()}
}
function next(){if(s.finished)return;snapshot();finishTurn();save();render()}function undo(){if(!undoStack.length){alert('Po znovuotevření aplikace nelze vrátit předchozí akce.');return}s=undoStack.pop();save();render()}function reset(){if(!confirm('Opravdu začít novou hru? Současná hra se smaže.'))return;let a=s.starter,b=s.order;s=fresh();s.starter=a;s.order=b;s.player=a;undoStack=[];save();render()}function setStarter(n){if(s.history.length||s.darts.length||s.target||s.round||s.done.length){if(!confirm('Změna začínajícího hráče zahájí novou hru. Pokračovat?'))return;s=fresh()}s.starter=n;s.player=n;save();render()}function setOrder(n){if(s.history.length||s.darts.length||s.target||s.round||s.done.length){if(!confirm('Změna pořadí zahájí novou hru. Pokračovat?')){$('sequence').value=s.order;return}s=fresh()}s.order=n;s.player=s.starter;save();render()}$('start0').onclick=()=>setStarter(0);$('start1').onclick=()=>setStarter(1);$('sequence').onchange=e=>setOrder(Number(e.target.value));function render(){let c=closer(),sc=scorer(),t=target();$('start0').classList.toggle('active',s.starter===0);$('start1').classList.toggle('active',s.starter===1);$('sequence').value=s.order;for(let i=0;i<2;i++){$('score'+i).textContent=s.scores[i];$('p'+i).classList.toggle('current',s.player===i&&!s.finished);$('role'+i).textContent=s.round===0?'1. kolo · ':'2. kolo · ';$('role'+i).textContent+=i===c?'ZAVÍRÁ':'SBÍRÁ BODY'}$('status').textContent=s.finished?'🏆 HRA SKONČILA':(s.round+1)+'. KOLO · '+(s.target+1)+'/7 · '+(s.closed?'TERČ UZAVŘEN':'TERČ OTEVŘEN');$('turn').textContent=s.finished?'Výsledek: '+(s.scores[0]===s.scores[1]?'remíza':names[s.scores[0]>s.scores[1]?0:1]+' vítězí'):'Na řadě: '+names[s.player]+' · '+(s.player===c?'zavírá terč':'sbírá body');$('targets').innerHTML=orders[s.order].map((v,i)=>'<button '+(s.order===3?'onclick="chooseTarget('+i+')"':'disabled')+' class="target '+(i===s.target?'active':(s.order===3?s.done.includes(i):i<s.target)?'closed':'')+'" '+(s.order===3&&(s.done.includes(i)||s.darts.length||s.closed||s.finished)?'disabled':'')+'>'+textTarget(v)+(s.order===3&&s.done.includes(i)?' ✓':'')+'</button>').join('');
const hits=t===25?[['BULL 25',25],['BULL 50',50],['MIMO',0]]:[['SINGLE '+t,t],['DOUBLE '+t,t*2],['TRIPLE '+t,t*3],['MIMO',0]];
$('hitButtons').innerHTML=hits.map(([label,value])=>'<button '+(s.finished?'disabled':'')+' onclick="hit('+ (t===25?value:value===0?0:value/t) +')">'+label+(value?' <small>('+value+' bodů)</small>':'')+'</button>').join('');
$('hitHelp').textContent=s.order===3?'Klepnutím na terč nahoře můžeš vybrat jiné číslo (mezi tahy, dokud není uzavřený).':'Tlačítka vždy odpovídají právě hranému terči.';
$('marks').textContent='Uzavírání: '+['○','◔','◕','●'][s.marks]+' ('+s.marks+'/3 zásahů)'+(s.closed?' ✓':'');$('darts').textContent='Aktuální tah ('+s.darts.length+'/3): '+(s.darts.map(d=>d.label).join(' · ')||'—');document.querySelectorAll('#hitButtons button,section.panel button.big').forEach(b=>b.disabled=s.finished);$('history').innerHTML=s.history.slice(-20).reverse().map(h=>'<div>'+h+'</div>').join('')||'<span class="muted">Zatím žádné dokončené tahy.</span>'}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
